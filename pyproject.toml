[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/python/*" = ["S101", "S105", "S106"]
"automation/prompts.py" = ["E501"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "node_modules"]
