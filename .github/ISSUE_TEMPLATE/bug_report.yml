name: Bug Report
description: Create a report to help us reproduce and fix a bug.
title: "fix: [Short description of the bug]"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please ensure you have read the `CONTRIBUTING.md` and checked for existing duplicate issues before proceeding.

  - type: checkboxes
    id: pre-flight
    attributes:
      label: Pre-flight checks
      options:
        - label: I have checked existing open and closed issues for duplicates.
          required: true
        - label: I am using the latest version of the action/script.
          required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Browser or Node.js version for the editor; Python version for automation. Never include tokens or private repository data.
      placeholder: e.g., Firefox 145 on Windows 11, or Python 3.11 on GitHub Actions
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Provide a clear, step-by-step algorithm to trigger the bug.
      placeholder: |
        1. Open the editor and select a year...
        2. Paint a cell and choose an action...
        3. Observe the error...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect the script/action to do?
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior / Traceback
      description: What actually occurred? Redact tokens, email addresses, and private repository details before sharing logs.
      render: shell
    validations:
      required: true
