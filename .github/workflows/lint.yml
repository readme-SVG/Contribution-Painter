name: Lint and Static Checks

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          if [ ! -f package.json ]; then
            echo "No package.json found. Skipping npm install."
            exit 0
          fi
          if [ -f package-lock.json ]; then
            echo "package-lock.json found. Running fast install (npm ci)..."
            npm ci
          else
            echo "package-lock.json NOT found. Generating it (npm install)..."
            npm install --no-audit --no-fund
          fi

      - name: Run project lint script when available
        run: |
          if [ -f package.json ]; then
            npm run lint --if-present
          else
            echo "No package.json found. Skipping lint."
          fi

      - name: Validate JavaScript syntax
        run: |
          found=0
          for dir in api js; do
            if [ -d "$dir" ]; then
              found=1
              while IFS= read -r -d '' file; do
                node --check "$file"
              done < <(find "$dir" -type f -name '*.js' -print0)
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No JavaScript directories found. Skipping JavaScript syntax validation."
          fi
